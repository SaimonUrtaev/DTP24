<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Новый убыток — DTP24</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background-color: #1c1c1e !important; color: #ffffff !important; }

    :root {
      --bg:        #1c1c1e;
      --card:      #2c2c2e;
      --border:    #48484a;
      --text:      #ffffff;
      --hint:      #8e8e93;
      --blue:      #2481cc;
      --blue-dark: #1a6aab;
      --success:   #30d158;
      --error:     #ff453a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 16px 16px 32px;
    }

    .header { text-align: center; padding: 16px 0 20px; }
    .header-icon {
      width: 56px; height: 56px;
      background: var(--blue); border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 12px;
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p  { font-size: 13px; color: var(--hint); margin-top: 4px; }

    .card { background: var(--card); border-radius: 16px; padding: 4px 0; margin-bottom: 12px; }

    .field { padding: 12px 16px; border-bottom: 1px solid var(--border); }
    .field:last-child { border-bottom: none; }

    .field label {
      display: block; font-size: 11px; font-weight: 600;
      color: var(--hint); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px;
    }

    .field input, .field select {
      width: 100%; background: transparent; border: none; outline: none;
      color: var(--text); font-size: 16px; font-family: inherit; padding: 0; -webkit-appearance: none;
    }
    .field select option { background: #2c2c2e; color: #fff; }
    .field input::placeholder { color: var(--hint); }

    .field.error label { color: var(--error); }
    .field.error { background: rgba(255,69,58,0.08); border-radius: 8px; }

    .btn {
      width: 100%; padding: 16px; background: var(--blue); color: #fff;
      border: none; border-radius: 14px; font-size: 17px; font-weight: 600;
      font-family: inherit; cursor: pointer; margin-top: 8px;
    }
    .btn:active { background: var(--blue-dark); }
    .btn:disabled { opacity: 0.5; }

    .success-screen {
      display: none; flex-direction: column; align-items: center;
      justify-content: center; min-height: 70vh; text-align: center; gap: 16px;
    }
    .success-screen.show { display: flex; }
    .success-icon {
      width: 80px; height: 80px; background: rgba(48,209,88,0.15);
      border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 40px;
    }
    .success-num { font-size: 36px; font-weight: 800; color: var(--success); }
    .success-screen h2 { font-size: 22px; font-weight: 700; }
    .success-screen p { font-size: 15px; color: var(--hint); line-height: 1.5; white-space: pre-line; }

    .error-msg {
      display: none; background: rgba(255,69,58,0.12); border: 1px solid rgba(255,69,58,0.3);
      border-radius: 10px; padding: 12px 16px; font-size: 13px; color: var(--error);
      margin-top: 8px; line-height: 1.4; word-break: break-all;
    }
    .error-msg.show { display: block; }

    .loader {
      display: inline-block; width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff;
      border-radius: 50%; animation: spin 0.7s linear infinite;
      vertical-align: middle; margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Загрузка фото ── */
    .photo-drop {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 20px 16px; text-align: center; cursor: pointer;
      transition: border-color 0.2s;
    }
    .photo-drop:active { border-color: var(--blue); }
    .photo-drop-icon { font-size: 32px; margin-bottom: 6px; }
    .photo-drop-text { font-size: 15px; color: var(--text); font-weight: 500; }
    .photo-drop-hint { font-size: 12px; color: var(--hint); margin-top: 3px; }

    .photo-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 8px; margin-top: 12px;
    }
    .photo-thumb {
      position: relative; aspect-ratio: 1;
      border-radius: 10px; overflow: hidden; background: #3a3a3c;
    }
    .photo-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .photo-thumb-remove {
      position: absolute; top: 4px; right: 4px;
      width: 22px; height: 22px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: none;
      color: #fff; font-size: 14px; line-height: 1;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
    }
    .photo-count {
      font-size: 13px; color: var(--hint); margin-top: 8px; text-align: center;
    }
  </style>
</head>
<body>

<div id="formView">
  <div class="header">
    <div class="header-icon">🚗</div>
    <h1>Новый убыток</h1>
    <p>Заполните данные по ДТП</p>
  </div>

  <div class="card">
    <div class="field" id="f-park">
      <label>Парк</label>
      <input type="text" id="park" placeholder="Название парка" autocomplete="off" />
    </div>
    <div class="field" id="f-brand">
      <label>Марка ТС</label>
      <input type="text" id="brand" placeholder="Например: Hyundai Solaris" autocomplete="off" />
    </div>
    <div class="field" id="f-grz">
      <label>Гос. номер</label>
      <input type="text" id="grz" placeholder="А123ВС799" autocomplete="off" />
    </div>
  </div>

  <div class="card">
    <div class="field" id="f-policy">
      <label>Полис ОСАГО</label>
      <input type="text" id="policy" placeholder="ХХХ 0000000000" autocomplete="off" />
    </div>
    <div class="field" id="f-date">
      <label>Дата ДТП</label>
      <input type="text" id="date_dtp" placeholder="ДД.ММ.ГГГГ" inputmode="numeric" maxlength="10" />
    </div>
  </div>

  <div class="card">
    <div class="field" id="f-insurance">
      <label>Страховая компания</label>
      <select id="insurance">
        <option value="">— Выберите СК —</option>
        <option>ИНГОССТРАХ</option>
        <option>РЕСО</option>
        <option>СОГАЗ</option>
        <option>АЛЬФА</option>
        <option>ВСК</option>
        <option>ОСК</option>
        <option>РЕНЕССАНС</option>
      </select>
    </div>
  </div>

  <div class="card">
    <div class="field" id="f-admin">
      <label>Админ материал</label>
      <input type="text" id="admin_note" placeholder="Заполняется вручную" autocomplete="off" />
    </div>
  </div>

  <div class="card">
    <div class="field">
      <label>Фото и документы</label>
      <div class="photo-drop" id="photoDrop" onclick="document.getElementById('photoInput').click()">
        <div class="photo-drop-icon">📷</div>
        <div class="photo-drop-text">Нажмите чтобы добавить фото</div>
        <div class="photo-drop-hint">Место ДТП, СТС, полис, материалы</div>
      </div>
      <input type="file" id="photoInput" accept="image/*" multiple
             style="display:none" onchange="handlePhotos(this.files)" />
      <div class="photo-grid" id="photoGrid"></div>
      <div class="photo-count" id="photoCount"></div>
    </div>
  </div>

  <button class="btn" id="submitBtn" onclick="submitForm()">Записать в таблицу</button>
  <div class="error-msg" id="errorMsg"></div>
</div>

<div class="success-screen" id="successView">
  <div class="success-icon">✅</div>
  <div class="success-num" id="successNum">#—</div>
  <h2>Убыток записан!</h2>
  <p id="successDetails"></p>
</div>

<script>
  const tg = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); }

  const API_URL = 'https://functions.yandexcloud.net/d4eb16ss7geankm98het';

  // ── Фото ────────────────────────────────────────────────────────────────────
  const MAX_PHOTOS = 10;
  const selectedPhotos = []; // [{dataUrl, name}]

  async function compressImage(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          const MAX_W = 1280;
          let w = img.width, h = img.height;
          if (w > MAX_W) { h = Math.round(h * MAX_W / w); w = MAX_W; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          canvas.toBlob((blob) => {
            const r = new FileReader();
            r.onload = (e2) => resolve({ dataUrl: e2.target.result, name: file.name });
            r.readAsDataURL(blob);
          }, 'image/jpeg', 0.82);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    });
  }

  async function handlePhotos(files) {
    const available = MAX_PHOTOS - selectedPhotos.length;
    if (available <= 0) return;
    const toAdd = Array.from(files).slice(0, available);
    for (const file of toAdd) {
      const compressed = await compressImage(file);
      selectedPhotos.push(compressed);
    }
    renderPhotoGrid();
  }

  function renderPhotoGrid() {
    const grid = document.getElementById('photoGrid');
    const count = document.getElementById('photoCount');
    grid.innerHTML = '';
    selectedPhotos.forEach((p, i) => {
      const thumb = document.createElement('div');
      thumb.className = 'photo-thumb';
      thumb.innerHTML =
        '<img src="' + p.dataUrl + '" />' +
        '<button class="photo-thumb-remove" onclick="removePhoto(' + i + ')">✕</button>';
      grid.appendChild(thumb);
    });
    if (selectedPhotos.length > 0) {
      count.textContent = 'Выбрано: ' + selectedPhotos.length + ' из ' + MAX_PHOTOS;
      document.getElementById('photoDrop').style.display =
        selectedPhotos.length < MAX_PHOTOS ? 'block' : 'none';
    } else {
      count.textContent = '';
      document.getElementById('photoDrop').style.display = 'block';
    }
    // Сбрасываем input чтобы можно было добавить те же файлы повторно
    document.getElementById('photoInput').value = '';
  }

  function removePhoto(index) {
    selectedPhotos.splice(index, 1);
    renderPhotoGrid();
  }

  // Автоформат ДД.ММ.ГГГГ
  document.getElementById('date_dtp').addEventListener('input', function(e) {
    let v = e.target.value.replace(/\D/g, '');
    if (v.length >= 3) v = v.slice(0,2) + '.' + v.slice(2);
    if (v.length >= 6) v = v.slice(0,5) + '.' + v.slice(5,9);
    e.target.value = v;
  });

  // Сегодняшняя дата по умолчанию
  const now = new Date();
  document.getElementById('date_dtp').value =
    String(now.getDate()).padStart(2,'0') + '.' +
    String(now.getMonth()+1).padStart(2,'0') + '.' +
    now.getFullYear();

  function validate() {
    const fields = [
      { id: 'park', fid: 'f-park' }, { id: 'brand', fid: 'f-brand' },
      { id: 'grz', fid: 'f-grz' },   { id: 'policy', fid: 'f-policy' },
      { id: 'date_dtp', fid: 'f-date' }, { id: 'insurance', fid: 'f-insurance' },
    ];
    let ok = true;
    fields.forEach(function(f) {
      const val = document.getElementById(f.id).value.trim();
      document.getElementById(f.fid).classList.toggle('error', !val);
      if (!val) ok = false;
    });
    return ok;
  }

  async function submitForm() {
    if (!validate()) { showError('Заполните все поля, отмеченные красным.'); return; }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="loader"></span>Сохраняем...';
    hideError();

    if (selectedPhotos.length > 0) {
      btn.innerHTML = '<span class="loader"></span>Отправляю фото...';
    }

    const data = {
      park:       document.getElementById('park').value.trim(),
      brand:      document.getElementById('brand').value.trim(),
      grz:        document.getElementById('grz').value.trim().toUpperCase(),
      policy:     document.getElementById('policy').value.trim(),
      date_dtp:   document.getElementById('date_dtp').value.trim(),
      insurance:  document.getElementById('insurance').value,
      admin_note: document.getElementById('admin_note').value.trim(),
      user_id:    (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) ? tg.initDataUnsafe.user.id : null,
      photos:     selectedPhotos.map(p => p.dataUrl),
    };

    try {
      const resp = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await resp.json();
      if (!resp.ok) throw new Error(result.error || 'HTTP ' + resp.status);
      showSuccess(result.number, data);
    } catch (e) {
      btn.disabled = false;
      btn.innerHTML = 'Записать в таблицу';
      showError('Ошибка: ' + e.message);
    }
  }

  function showSuccess(number, data) {
    document.getElementById('formView').style.display = 'none';
    document.getElementById('successView').classList.add('show');
    document.getElementById('successNum').textContent = '#' + number;
    const photoLine = data.photos.length > 0 ? '\n📎 Фото: ' + data.photos.length + ' шт.' : '';
    document.getElementById('successDetails').textContent =
      data.park + ' · ' + data.brand + ' · ' + data.grz + '\n' + data.date_dtp + ' · ' + data.insurance + photoLine;
    // Закрываем форму — бот получит уведомление через Cloud Function
    setTimeout(function() {
      if (tg) tg.close();
    }, 2000);
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg; el.classList.add('show');
  }
  function hideError() { document.getElementById('errorMsg').classList.remove('show'); }
</script>
</body>
</html>
